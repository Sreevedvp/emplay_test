services:
  backend:
    build: ./backend
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - '4200:80'
    depends_on:
      backend:
        condition: service_healthy
